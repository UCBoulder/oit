oit.request:
  path: '/request-catalog'
  defaults:
    _controller: '\Drupal\oit\Controller\OitController::requestPortal'
    _title: ''
  requirements:
    _permission: 'access content'
oit.404:
  path: '/404'
  defaults:
    _controller: '\Drupal\oit\Controller\OitController::oit404'
    _title: 'Page Not Found'
  requirements:
    _permission: 'access content'
oit.saml.login:
  path: '/saml/login'
  defaults:
    _controller: '\Drupal\oit\Controller\OitController::oitSamlLogin'
    _title: ''
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'
oit.denied:
  path: '/denied'
  defaults:
    _controller: '\Drupal\oit\Controller\OitController::oitDenied'
    _title: ''
  requirements:
    _permission: 'access content'
oit.health:
  path: '/service-health'
  defaults:
    _controller: '\Drupal\oit\Controller\OitController::serviceAlertHealth'
    _title: 'Service Health'
  requirements:
    _permission: 'access content'
oit.useredit:
  path: '/user/me/edit'
  defaults:
    _controller: '\Drupal\oit\Controller\OitController::oitUserEdit'
    _title: ''
  requirements:
    _role: 'authenticated'
oit.abusetable:
  path: '/admin/config/people/autoban/abusetable'
  defaults:
    _controller: '\Drupal\oit\Controller\AbuseController::abuseIpTable'
    _title: 'Low Confidence Banned IPs'
  requirements:
    _permission: 'administer autoban'
oit.abusekeep:
  path: '/admin/config/people/autoban/abusetable/keep/{ip}'
  defaults:
    _controller: '\Drupal\oit\Controller\AbuseController::abuseIpKeep'
    _title: ''
  requirements:
    _permission: 'administer autoban'
oit.abusenokeep:
  path: '/admin/config/people/autoban/abusetable/nokeep/{ip}'
  defaults:
    _controller: '\Drupal\oit\Controller\AbuseController::abuseIpNoKeep'
    _title: ''
  requirements:
    _permission: 'administer autoban'
oit.abusewhitelist:
  path: '/admin/config/people/autoban/abusetable/whitelist/{ip}'
  defaults:
    _controller: '\Drupal\oit\Controller\AbuseController::abuseIpWhitelist'
    _title: ''
  requirements:
    _permission: 'administer autoban'
