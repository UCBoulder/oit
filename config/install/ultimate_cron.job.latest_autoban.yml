langcode: en
status: true
dependencies:
  module:
    - oit
title: 'Message Latest Autoban'
id: latest_autoban
weight: -9
module: oit
callback: '\Drupal\oit\Services\CronManager::autoBan'
scheduler:
  id: crontab
  configuration:
    rules:
      - '30 00 * * *'
    catch_up: 14400
launcher:
  id: serial
  configuration:
    timeouts:
      lock_timeout: 3600
    launcher:
      thread: 0
logger:
  id: database
  configuration:
    method: '3'
    expire: 1209600
    retain: 1000
